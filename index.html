<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>M&amp;N Foods</title>
  <meta name="description" content="Onze restaurants: waar we al waren, wat we ervan vonden en waar we nog naartoe willen.">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="M&amp;N Foods">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/pinyon-script.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/leaflet-1.9.4.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="vendor/leaflet-1.9.4.js" defer></script>
  <script src="vendor/supabase-2.118.0.js" defer></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="shield" id="shield" aria-hidden="true"></div>

  <div class="app" id="app">
    <header class="topbar">
      <button class="citybtn" id="btn-city" type="button" aria-haspopup="dialog" aria-label="Stad kiezen">
        <span id="city-name">Gent</span><span class="citybtn__chev" data-icon="chevronDown"></span>
      </button>
      <div class="brand" role="img" aria-label="M&amp;N Foods">
        <span class="brand__mark" aria-hidden="true">M&amp;N</span>
        <span class="brand__word" aria-hidden="true">Foods</span>
      </div>
      <div class="topbar__actions">
        <button class="icon-btn" id="btn-search" type="button" aria-label="Zoeken" data-icon="search"></button>
        <button class="icon-btn" id="btn-stats" type="button" aria-label="Statistieken" data-icon="chart"></button>
      </div>
    </header>

    <div class="sticky" id="sticky">
      <nav class="tabs" id="cats" aria-label="Waar heb je zin in?"></nav>
      <div class="controls">
        <div class="seg" id="statusbar" role="radiogroup" aria-label="Waar we al waren"></div>
        <button class="filterbtn" id="btn-filters" type="button" aria-label="Filters">
          <span data-icon="sliders"></span><span class="filterbtn__count" id="filter-count" hidden></span>
        </button>
      </div>
    </div>

    <main class="main" id="main">
      <p class="sr-only" id="result-count" role="status"></p>
      <ul class="cards" id="list" aria-label="Restaurants"></ul>
      <div class="empty" id="empty" hidden></div>
    </main>

    <section class="mapview" id="mapview" aria-label="Kaart">
      <div class="mapview__map" id="map"></div>
      <ul class="legend" aria-label="Legende">
        <li><span class="pin pin--nog_niet"></span>Nog niet</li>
        <li><span class="pin pin--noah"></span>Noah</li>
        <li><span class="pin pin--marie"></span>Marie</li>
        <li><span class="pin pin--samen"></span>Samen</li>
      </ul>
      <button class="icon-btn icon-btn--float mapview__locate" id="btn-locate" type="button" aria-label="Toon mijn locatie" data-icon="locate"></button>
      <div class="mapview__preview" id="map-preview" hidden></div>
    </section>

    <div class="dock" id="dock">
      <button class="dock__btn" id="btn-view" type="button"><span class="dock__icon" id="view-icon"></span><span id="view-label">Kaart</span></button>
      <span class="dock__sep" aria-hidden="true"></span>
      <button class="dock__btn" id="btn-surprise" type="button"><span class="dock__icon" data-icon="dice"></span>Verras me</button>
    </div>

    <div class="bottombar">
      <button class="bottombar__btn" id="btn-add" type="button"><span class="bottombar__icon" data-icon="plus"></span>Restaurant toevoegen</button>
    </div>
  </div>

  <section class="page page--detail" id="detail" hidden role="dialog" aria-modal="true" aria-label="Restaurant"></section>
  <section class="page page--stats" id="stats" hidden role="dialog" aria-modal="true" aria-label="Statistieken"></section>
  <div id="sheet-root"></div>
  <div class="banner" id="banner" role="status" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">M&amp;N Foods heeft JavaScript nodig.</p></noscript>
</body>
</html>
